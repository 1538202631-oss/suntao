<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-visual" aria-label="品牌介绍">
      <div class="brand-mark">S</div>
      <div>
        <p class="eyebrow">WELCOME</p>
        <h1>统一管理你的业务工作台</h1>
        <p class="auth-copy">这是第一阶段页面骨架，后续可以直接按照现有 src 页面替换品牌、配色、插图与字段。</p>
      </div>
      <div class="visual-orb visual-orb-a"></div>
      <div class="visual-orb visual-orb-b"></div>
    </section>

    <section class="auth-panel">
      <form class="login-card" id="loginForm">
        <div class="mobile-brand">S</div>
        <p class="eyebrow">ACCOUNT</p>
        <h2>登录系统</h2>
        <p class="muted">请输入账号信息进入首页</p>

        <label class="field">
          <span>账号</span>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required />
        </label>

        <label class="field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
        </label>

        <div class="form-row">
          <label class="checkbox"><input type="checkbox" /> <span>记住我</span></label>
          <button class="link-button" type="button">忘记密码？</button>
        </div>

        <button class="primary-button" type="submit">登录</button>
        <p class="form-tip" id="loginTip">演示阶段：任意非空账号和密码均可登录。</p>
      </form>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
